<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#050505" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="FelFel" />
<title>FelFel Manager | فيلفيل مانجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<!-- Background -->
<div class="bg-scene" aria-hidden="true">
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-grid"></div>


</div>

<!-- Cursor glow -->
<div id="cursorGlow" class="cursor-glow"></div>

<!-- PIN Lock -->
<div id="pinLock" class="pin-lock hidden">
  <div class="pin-box">
    <div class="pin-brand">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 5 L12 1.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M9 5.2 L10.2 3.5 L12 4.3 L13.8 3.5 L15 5.2 Q12 6.2 9 5.2 Z" fill="#fff"/>
        <path d="M12 5.5
                 C 10 5.5, 8 6.5, 7 8.5
                 C 6 10.5, 5.5 13, 5.8 16
                 C 6 18.5, 7 21, 9 22
                 C 10 22.5, 11 22.3, 12 21.5
                 C 13 22.3, 14 22.5, 15 22
                 C 17 21, 18 18.5, 18.2 16
                 C 18.5 13, 18 10.5, 17 8.5
                 C 16 6.5, 14 5.5, 12 5.5 Z" fill="#fff"/>
      </svg>
    </div>
    <h2>FelFel Manager</h2>
    <p data-i18n="pin.enter">أدخل الرمز PIN</p>
    <input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="6" autocomplete="off" />
    <div id="pinError" class="pin-error"></div>
  </div>
</div>

<!-- Splash -->
<div id="splash" class="splash">
  <div class="splash-logo">
    <div class="splash-letter">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" style="width:42px;height:42px">
        <path d="M12 5 L12 1.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M9 5.2 L10.2 3.5 L12 4.3 L13.8 3.5 L15 5.2 Q12 6.2 9 5.2 Z" fill="#fff"/>
        <path d="M12 5.5
                 C 10 5.5, 8 6.5, 7 8.5
                 C 6 10.5, 5.5 13, 5.8 16
                 C 6 18.5, 7 21, 9 22
                 C 10 22.5, 11 22.3, 12 21.5
                 C 13 22.3, 14 22.5, 15 22
                 C 17 21, 18 18.5, 18.2 16
                 C 18.5 13, 18 10.5, 17 8.5
                 C 16 6.5, 14 5.5, 12 5.5 Z" fill="#fff"/>
      </svg>
    </div>
    <div class="splash-ring"></div>
  </div>
  <div class="splash-name">FelFel Manager</div>
</div>

<div id="app" class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg class="logo-pepper" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 5 L12 1.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M9 5.2 L10.2 3.5 L12 4.3 L13.8 3.5 L15 5.2 Q12 6.2 9 5.2 Z" fill="#fff"/>
          <path d="M12 5.5
                   C 10 5.5, 8 6.5, 7 8.5
                   C 6 10.5, 5.5 13, 5.8 16
                   C 6 18.5, 7 21, 9 22
                   C 10 22.5, 11 22.3, 12 21.5
                   C 13 22.3, 14 22.5, 15 22
                   C 17 21, 18 18.5, 18.2 16
                   C 18.5 13, 18 10.5, 17 8.5
                   C 16 6.5, 14 5.5, 12 5.5 Z" fill="#fff"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>FelFel</h1>
        <span data-i18n="brand.tagline">Manager</span>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-page="dashboard"><span class="ico">◧</span><span data-i18n="nav.dashboard">لوحة التحكم</span><span class="nav-indicator"></span></button>
      <button class="nav-item" data-page="inventory"><span class="ico">▦</span><span data-i18n="nav.inventory">الإنتاج والمخزون</span><span class="nav-indicator"></span></button>
      <button class="nav-item" data-page="sales"><span class="ico">▤</span><span data-i18n="nav.sales">المبيعات والفواتير</span><span class="nav-indicator"></span></button>
      <button class="nav-item" data-page="customers"><span class="ico">◍</span><span data-i18n="nav.customers">العملاء والديون</span><span class="nav-indicator"></span></button>
      <button class="nav-item" data-page="expenses"><span class="ico">◈</span><span data-i18n="nav.expenses">المصروفات</span><span class="nav-indicator"></span></button>
      <button class="nav-item" data-page="cashbox"><span class="ico">◉</span><span data-i18n="nav.cashbox">الخزنة</span><span class="nav-indicator"></span></button>
      <button class="nav-item" data-page="workers"><span class="ico">◐</span><span data-i18n="nav.workers">العمال والأجور</span><span class="nav-indicator"></span></button>
      <button class="nav-item" data-page="partners"><span class="ico">◑</span><span data-i18n="nav.partners">الشركاء والأرباح</span><span class="nav-indicator"></span></button>
      <button class="nav-item" data-page="reports"><span class="ico">▣</span><span data-i18n="nav.reports">التقارير</span><span class="nav-indicator"></span></button>
      <button class="nav-item" data-page="activity"><span class="ico">☰</span><span data-i18n="nav.activity">سجل النشاط</span><span class="nav-indicator"></span></button>
      <button class="nav-item" data-page="settings"><span class="ico">⚙</span><span data-i18n="nav.settings">الإعدادات</span><span class="nav-indicator"></span></button>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-ghost" id="langBtn">EN</button>
      <button class="btn-ghost" id="themeBtn">☀</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h2 id="pageTitle">لوحة التحكم</h2>
      <div class="topbar-actions">
        <button class="btn-ghost calc-btn" id="profitCalcBtn" title="حاسبة الربح">🧮</button>
        <button class="btn-ghost cmd-btn" id="cmdBtn" title="Ctrl+K">⌘ K</button>
        <div class="cash-pill" id="cashPill">
          <span class="cash-dot"></span>
          <span id="cashPillText">الخزنة: 0 ج.م</span>
        </div>
      </div>
    </header>
    <div id="alertsBar" class="alerts-bar"></div>
    <div id="content" class="content"></div>
  </main>
</div>

<!-- Command Palette -->
<div id="cmdPalette" class="cmd-backdrop hidden">
  <div class="cmd-box">
    <input id="cmdInput" class="cmd-input" placeholder="اكتب أمر..." />
    <div id="cmdResults" class="cmd-results"></div>
  </div>
</div>

<!-- Print container -->
<div id="printArea" class="print-area"></div>

<!-- Confetti canvas -->
<canvas id="confetti" class="confetti-canvas"></canvas>

<!-- Sound toggle -->
<button id="soundToggle" class="sound-toggle" title="Sound">🔊</button>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Modal -->
<div id="modal" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">نموذج</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
